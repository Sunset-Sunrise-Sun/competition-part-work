name: Validate LocalFit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r backend/requirements.lock.txt
      - run: python -m pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: pip install -r backend/requirements.lock.txt
        working-directory: .
      - run: python scripts/evaluate_plans.py
        working-directory: .
      - run: node frontend/scripts/evaluate.mjs synthetic - .localrun/synthetic_replay.json
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: rule-and-replay-evidence
          path: |
            .localrun/plan_comparison.json
            .localrun/synthetic_replay.json
